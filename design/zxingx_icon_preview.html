<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZXingX App 图标</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 44px;
    background: linear-gradient(180deg, #f5f5f7 0%, #eaeaee 100%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .icon-hero {
    width: 320px;
    height: 320px;
    filter: drop-shadow(0 24px 48px rgba(0, 0, 0, .12)) drop-shadow(0 4px 10px rgba(0,0,0,.06));
    transition: transform .5s cubic-bezier(.22, 1, .36, 1);
  }
  .icon-hero:hover { transform: scale(1.04); }
  .icon-hero svg { width: 100%; height: 100%; display: block; }

  .sizes { display: flex; align-items: flex-end; gap: 28px; }
  .sizes .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .sizes svg { display: block; filter: drop-shadow(0 6px 14px rgba(0,0,0,.10)); }
  .sizes span { color: #86868b; font-size: 12px; letter-spacing: .05em; }

  .name {
    color: #1d1d1f;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .12em;
  }
</style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <clipPath id="sqClip">
        <path d="M512 24C818 24 1000 206 1000 512S818 1000 512 1000 24 818 24 512 206 24 512 24Z"/>
      </clipPath>

      <!--
        布局：
        - QR 单元 176×176：左/右列 x = 276 / 572（列距 120），上/下行 y = 265 / 583
        - 单元 ↔ 扫描线垂直间距 = 64（线 y 505~519，居中 512）
        - 外四角位于 181~843 × 181~843 的正方形四顶点，整体居中于 512
      -->
      <g id="zxIcon">
        <rect width="1024" height="1024" fill="#ffffff"/>
        <g clip-path="url(#sqClip)">

          <!-- 取景框四角：构成一个完整正方形的四角 -->
          <g stroke="#1d1d1f" stroke-width="40" stroke-linecap="round" fill="none">
            <path d="M181 281 V211 a30 30 0 0 1 30-30 h70"/>
            <path d="M843 281 V211 a30 30 0 0 0-30-30 h-70"/>
            <path d="M181 743 V813 a30 30 0 0 0 30 30 h70"/>
            <path d="M843 743 V813 a30 30 0 0 1-30 30 h-70"/>
          </g>

          <!-- QR 定位框：左上（主，黑）右上 / 左下（灰） -->
          <g fill="none" stroke-width="32">
            <rect x="276" y="265" width="176" height="176" rx="34" stroke="#1d1d1f"/>
            <rect x="572" y="265" width="176" height="176" rx="34" stroke="#8e8e93"/>
            <rect x="276" y="583" width="176" height="176" rx="34" stroke="#8e8e93"/>
          </g>
          <!-- 主定位框蓝色内芯（居中于 364,353） -->
          <rect x="340" y="329" width="48" height="48" rx="12" fill="#0A84FF"/>

          <!-- 右下单元：2×2 数据点（居中于 660,671） -->
          <rect x="576" y="587" width="72" height="72" rx="17" fill="#1d1d1f"/>
          <rect x="672" y="587" width="72" height="72" rx="17" fill="#8e8e93"/>
          <rect x="576" y="683" width="72" height="72" rx="17" fill="#8e8e93"/>
          <rect x="672" y="683" width="72" height="72" rx="17" fill="#0A84FF"/>

          <!-- 扫描线：与 QR 区域等宽，垂直居中于 512 -->
          <rect x="276" y="505" width="472" height="14" rx="7" fill="#0A84FF"/>
        </g>
      </g>
    </defs>
  </svg>

  <!-- 主图标 -->
  <div class="icon-hero">
    <svg viewBox="0 0 1024 1024"><use href="#zxIcon"/></svg>
  </div>

  <div class="name">ZXingX</div>

  <!-- 多尺寸预览 -->
  <div class="sizes">
    <div class="cell">
      <svg width="120" height="120" viewBox="0 0 1024 1024"><use href="#zxIcon"/></svg>
      <span>120pt</span>
    </div>
    <div class="cell">
      <svg width="80" height="80" viewBox="0 0 1024 1024"><use href="#zxIcon"/></svg>
      <span>80pt</span>
    </div>
    <div class="cell">
      <svg width="48" height="48" viewBox="0 0 1024 1024"><use href="#zxIcon"/></svg>
      <span>48pt</span>
    </div>
  </div>

</body>
</html>
