name: CI

# 一份工作流：
# - push / pull_request → 编译 debug APK
# - 手动 Run workflow → 写版本号、打 release APK、创建 GitHub Release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（如 v1.0.0），仅手动发布时使用"
        required: true
        default: "v1.0.0"
        type: string
      release_notes:
        description: "Release 说明（Markdown，可选）"
        required: false
        default: ""
        type: string
      prerelease:
        description: "标记为 pre-release"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.version }}"
          RAW="$(echo "$RAW" | xargs)"
          if [[ -z "$RAW" ]]; then
            RAW="v1.0.0"
          fi
          if [[ "$RAW" != v* ]]; then
            TAG="v${RAW}"
          else
            TAG="$RAW"
          fi
          NAME="${TAG#v}"
          if [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([-.].*)?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            echo "Version '$NAME' is not X.Y.Z; using date-based versionCode"
            CODE="$(date -u +%y%m%d%H)"
            CODE=$((10#$CODE))
          fi
          if (( CODE < 1 )); then CODE=1; fi
          {
            echo "tag=${TAG}"
            echo "name=${NAME}"
            echo "code=${CODE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} name=${NAME} code=${CODE}"

      - name: Write version into gradle.properties
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          if grep -q '^VERSION_NAME=' gradle.properties; then
            sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${NAME}/" gradle.properties
          else
            echo "VERSION_NAME=${NAME}" >> gradle.properties
          fi
          if grep -q '^VERSION_CODE=' gradle.properties; then
            sed -i "s/^VERSION_CODE=.*/VERSION_CODE=${CODE}/" gradle.properties
          else
            echo "VERSION_CODE=${CODE}" >> gradle.properties
          fi
          grep -E '^VERSION_(NAME|CODE)=' gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "No release APK found" >&2
            exit 1
          fi
          NAME="ZXingX-${{ steps.ver.outputs.tag }}.apk"
          cp "$APK" "$NAME"
          echo "path=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ${{ github.event.inputs.release_notes }}

            ---
            - versionName: `${{ steps.ver.outputs.name }}`
            - versionCode: `${{ steps.ver.outputs.code }}`
            - commit: `${{ github.sha }}`
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
