name: CI

# 一份工作流：
# - push / pull_request → 编译 debug APK + iOS 无签名编译验证（上传 .app / .ipa artifact）
# - 手动 Run workflow → 写版本号、打 release APK + 未签名 iOS IPA、创建 GitHub Release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（如 v1.0.0），仅手动发布时使用"
        required: true
        default: "v1.0.0"
        type: string
      release_notes:
        description: "Release 说明（Markdown，可选）"
        required: false
        default: ""
        type: string
      prerelease:
        description: "标记为 pre-release"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :zxing-lite:testDebugUnitTest :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # iOS 版（swiftui/ 目录）：与 Android 同步编译。
  # 运行单元测试并做无签名 Release 编译验证，同时把无签名 .app 打包成
  # 未签名 .ipa（Payload 结构）。仓库没有 Apple Developer 签名材料，ipa 只能
  # 重签名后侧载；发布时由 release-ios job 把 ipa 附上 GitHub Release。
  build-ios:
    name: Build iOS (swiftui)
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # 部分 macos-15 运行器没有预装任何 iOS 模拟器（release-ios 曾实测失败：
      # "no available devices matched the request"）。目的地必须动态解析：
      # 有设备直接用；有 runtime 无设备则 simctl create；连 runtime 都没有则
      # 下载 iOS 平台后再建。
      - name: Resolve iOS Simulator destination
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(xcrun simctl list -j | python3 scripts/pick_ios_simulator.py || true)"
          if [[ -z "$OUT" ]]; then
            echo "No iOS Simulator runtime on this runner; downloading iOS platform"
            xcodebuild -runFirstLaunch
            xcodebuild -downloadPlatform iOS
            OUT="$(xcrun simctl list -j | python3 scripts/pick_ios_simulator.py || true)"
          fi
          if [[ "$OUT" == create\ * ]]; then
            DTYPE="$(echo "$OUT" | cut -d' ' -f2)"
            RT="$(echo "$OUT" | cut -d' ' -f3)"
            echo "Creating iPhone simulator ($DTYPE on $RT)"
            UDID="$(xcrun simctl create ZXingX-CI "$DTYPE" "$RT")"
          elif [[ "$OUT" == udid\ * ]]; then
            UDID="${OUT#udid }"
          else
            echo "Unable to obtain an iPhone simulator on this runner" >&2
            exit 1
          fi
          echo "Using iOS Simulator UDID: $UDID"
          echo "dest=platform=iOS Simulator,id=${UDID}" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        working-directory: swiftui
        run: |
          xcodebuild test \
            -project ZXingX.xcodeproj \
            -scheme ZXingX \
            -destination '${{ steps.sim.outputs.dest }}' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS app (unsigned Release)
        working-directory: swiftui
        run: |
          set -o pipefail
          xcodebuild build \
            -project ZXingX.xcodeproj \
            -scheme ZXingX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        working-directory: swiftui
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ZXingX.app"
          rm -rf Payload ZXingX-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ZXingX-unsigned.ipa Payload
          ls -lh ZXingX-unsigned.ipa

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: ZXingX-ios-unsigned-app
          path: swiftui/build/Build/Products/Release-iphoneos/ZXingX.app
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZXingX-ios-unsigned-ipa
          path: swiftui/ZXingX-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.version }}"
          RAW="$(echo "$RAW" | xargs)"
          if [[ -z "$RAW" ]]; then
            RAW="v1.0.0"
          fi
          if [[ "$RAW" != v* ]]; then
            TAG="v${RAW}"
          else
            TAG="$RAW"
          fi
          NAME="${TAG#v}"
          if [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([-.].*)?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            echo "Version '$NAME' is not X.Y.Z; using date-based versionCode"
            CODE="$(date -u +%y%m%d%H)"
            CODE=$((10#$CODE))
          fi
          if (( CODE < 1 )); then CODE=1; fi
          {
            echo "tag=${TAG}"
            echo "name=${NAME}"
            echo "code=${CODE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} name=${NAME} code=${CODE}"

      - name: Write version into gradle.properties
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          if grep -q '^VERSION_NAME=' gradle.properties; then
            sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${NAME}/" gradle.properties
          else
            echo "VERSION_NAME=${NAME}" >> gradle.properties
          fi
          if grep -q '^VERSION_CODE=' gradle.properties; then
            sed -i "s/^VERSION_CODE=.*/VERSION_CODE=${CODE}/" gradle.properties
          else
            echo "VERSION_CODE=${CODE}" >> gradle.properties
          fi
          grep -E '^VERSION_(NAME|CODE)=' gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :zxing-lite:testDebugUnitTest :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "No release APK found" >&2
            exit 1
          fi
          NAME="ZXingX-${{ steps.ver.outputs.tag }}.apk"
          cp "$APK" "$NAME"
          echo "path=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ${{ github.event.inputs.release_notes }}

            ---
            - versionName: `${{ steps.ver.outputs.name }}`
            - versionCode: `${{ steps.ver.outputs.code }}`
            - commit: `${{ github.sha }}`
            - Android: `ZXingX-${{ steps.ver.outputs.tag }}.apk`
            - iOS: `ZXingX-${{ steps.ver.outputs.tag }}-unsigned.ipa`（未签名，需用自有证书 / AltStore / Sideloadly 等重签名后侧载）
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发布时的 iOS 产物：与 release job（Android APK）并行同一个 tag。
  # 仓库无 Apple Developer 签名材料，只能产出未签名 ipa；needs: release 保证
  # GitHub Release 已存在，再用 gh CLI 只追加上传附件、不动 release 元数据。
  release-ios:
    name: Release iOS (unsigned IPA)
    if: github.event_name == 'workflow_dispatch'
    needs: release
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # 部分 macos-15 运行器没有预装任何 iOS 模拟器（release-ios 曾实测失败：
      # "no available devices matched the request"）。目的地必须动态解析：
      # 有设备直接用；有 runtime 无设备则 simctl create；连 runtime 都没有则
      # 下载 iOS 平台后再建。
      - name: Resolve iOS Simulator destination
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(xcrun simctl list -j | python3 scripts/pick_ios_simulator.py || true)"
          if [[ -z "$OUT" ]]; then
            echo "No iOS Simulator runtime on this runner; downloading iOS platform"
            xcodebuild -runFirstLaunch
            xcodebuild -downloadPlatform iOS
            OUT="$(xcrun simctl list -j | python3 scripts/pick_ios_simulator.py || true)"
          fi
          if [[ "$OUT" == create\ * ]]; then
            DTYPE="$(echo "$OUT" | cut -d' ' -f2)"
            RT="$(echo "$OUT" | cut -d' ' -f3)"
            echo "Creating iPhone simulator ($DTYPE on $RT)"
            UDID="$(xcrun simctl create ZXingX-CI "$DTYPE" "$RT")"
          elif [[ "$OUT" == udid\ * ]]; then
            UDID="${OUT#udid }"
          else
            echo "Unable to obtain an iPhone simulator on this runner" >&2
            exit 1
          fi
          echo "Using iOS Simulator UDID: $UDID"
          echo "dest=platform=iOS Simulator,id=${UDID}" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        working-directory: swiftui
        run: |
          xcodebuild test \
            -project ZXingX.xcodeproj \
            -scheme ZXingX \
            -destination '${{ steps.sim.outputs.dest }}' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS app (unsigned Release)
        working-directory: swiftui
        run: |
          set -o pipefail
          xcodebuild build \
            -project ZXingX.xcodeproj \
            -scheme ZXingX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ needs.release.outputs.name }}" \
            CURRENT_PROJECT_VERSION="${{ needs.release.outputs.code }}"

      - name: Package unsigned IPA
        working-directory: swiftui
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ZXingX.app"
          IPA="ZXingX-${{ needs.release.outputs.tag }}-unsigned.ipa"
          rm -rf Payload "$IPA"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$IPA" Payload
          cp "$IPA" "$GITHUB_WORKSPACE/$IPA"
          ls -lh "$GITHUB_WORKSPACE/$IPA"

      - name: Upload IPA to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IPA="$GITHUB_WORKSPACE/ZXingX-${{ needs.release.outputs.tag }}-unsigned.ipa"
          gh release upload "${{ needs.release.outputs.tag }}" "$IPA" --clobber
