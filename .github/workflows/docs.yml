name: Docs

# Optional. Upstream reusable docs action is not used in this fork.
# Enable / replace when you host API docs yourself.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Docs workflow is disabled by default in this fork"
        required: false
        default: "noop"
        type: string

jobs:
  noop:
    name: Docs noop
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        run: |
          echo "Docs publishing is not configured for this fork."
          echo "API docs remain available from upstream if needed."
