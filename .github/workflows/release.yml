name: Release

# Manual release: Actions → Release → Run workflow
# Default version: v1.0.0
# Writes VERSION_NAME / VERSION_CODE into gradle.properties, builds signed release APK,
# creates a GitHub Release with the APK attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string
      release_notes:
        description: "Release notes (optional, Markdown)"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.version }}"
          RAW="$(echo "$RAW" | xargs)"
          if [[ -z "$RAW" ]]; then
            RAW="v1.0.0"
          fi
          if [[ "$RAW" != v* ]]; then
            TAG="v${RAW}"
          else
            TAG="$RAW"
          fi
          # strip leading v for versionName
          NAME="${TAG#v}"
          # semver X.Y.Z -> versionCode
          if [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([-.].*)?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            echo "Version '$NAME' is not X.Y.Z; falling back to date-based versionCode"
            CODE="$(date -u +%y%m%d%H)"
            CODE=$((10#$CODE))
          fi
          if (( CODE < 1 )); then CODE=1; fi
          {
            echo "tag=${TAG}"
            echo "name=${NAME}"
            echo "code=${CODE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} name=${NAME} code=${CODE}"

      - name: Write version into gradle.properties
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          if grep -q '^VERSION_NAME=' gradle.properties; then
            sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${NAME}/" gradle.properties
          else
            echo "VERSION_NAME=${NAME}" >> gradle.properties
          fi
          if grep -q '^VERSION_CODE=' gradle.properties; then
            sed -i "s/^VERSION_CODE=.*/VERSION_CODE=${CODE}/" gradle.properties
          else
            echo "VERSION_CODE=${CODE}" >> gradle.properties
          fi
          echo "---- gradle.properties (version keys) ----"
          grep -E '^VERSION_(NAME|CODE)=' gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "No release APK found" >&2
            exit 1
          fi
          NAME="ZXingX-${{ steps.ver.outputs.tag }}.apk"
          cp "$APK" "$NAME"
          echo "path=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ${{ github.event.inputs.release_notes }}

            ---
            - App versionName: `${{ steps.ver.outputs.name }}`
            - App versionCode: `${{ steps.ver.outputs.code }}`
            - Commit: `${{ github.sha }}`
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
